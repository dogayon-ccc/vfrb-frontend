    <!-- Task 1 (PWA install-to-home-screen, Aug 30 2026): Android already
         reads vite-plugin-pwa's generated manifest.webmanifest for its
         native install prompt (no HTML changes needed there). iOS Safari
         ignores the web manifest for "Add to Home Screen" almost entirely
         and instead needs these apple-* tags read directly, plus its own
         icon link (apple-touch-icon.png, already shipped in /public since
         the Aug 24 2026 PWA commit) — this is the missing half. -->
    <meta name="theme-color" content="#028090" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VFRB" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>VFRB Enterprise</title>
